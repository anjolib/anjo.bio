<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>home</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="../favicon.ico" sizes="any" />
  </head>
  <body>
    <main>
      <p><time id="clock"></time></p>
      <nav>
        <section>
          <ul>
            <li><a href="https://canvas.harvard.edu">canvas</a></li>
            <li><a href="https://drive.google.com">drive</a></li>
            <li><a href="https://github.com/anjolib">github</a></li>
            <li><a href="https://my.harvard.edu">my.harvard</a></li>
          </ul>
        </section>
      </nav>
    </main>
    <script>
      const clock = document.getElementById("clock");

      function tick() {
        const now = new Date();
        clock.dateTime = now.toISOString();
        clock.textContent = now.toLocaleString("en-US", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        });
      }

      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
